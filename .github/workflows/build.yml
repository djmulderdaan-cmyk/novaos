# RandomOS build - bouwt het OS-image en zet het op ghcr.io
name: bouw-randomos
on:
  schedule:
    - cron: "00 06 * * *" # elke dag nieuwe build met de laatste Bazzite-updates
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch: # handmatig starten via de Actions-tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Bouw RandomOS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Bouw image
        uses: blue-build/github-action@v1.8
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
