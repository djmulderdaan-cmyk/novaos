# Bouwt een installatie-ISO van RandomOS (handmatig starten via Actions -> bouw-randomos-iso -> Run workflow).
# Gebaseerd op hoe Bazzite zijn eigen ISO's maakt: een live-omgeving met de installer,
# die jouw RandomOS-image (ghcr.io/<jij>/randomos) op de schijf zet.
name: bouw-randomos-iso
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Vaste versie van Bazzite's installer-recept (getest met deze commit)
  BAZZITE_REF: 025ad3a0a18c4462033a757d0adff78198f82730

jobs:
  build-iso:
    name: Bouw RandomOS-ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Schijfruimte vrijmaken
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Opslag voor containers (btrfs, gecomprimeerd)
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true

      - name: Installer-recept van Bazzite ophalen
        uses: actions/checkout@v4
        with:
          repository: ublue-os/bazzite
          ref: ${{ env.BAZZITE_REF }}
          path: bazzite-src
          sparse-checkout: installer

      - name: Installer aanpassen voor RandomOS
        working-directory: bazzite-src/installer
        run: |
          set -euxo pipefail
          # De installer zoekt het te installeren image op naam
          sed -i "s/'bazzite\*'/'randomos*'/g" titanoboa_hook_postrootfs.sh
          grep -n "randomos\*" titanoboa_hook_postrootfs.sh
          # Naam in het opstartmenu van de USB-stick
          sed -i 's/Bazzite-Live/RandomOS-Live/g; s/Launch Bazzite Installer/RandomOS installeren/g' iso.yaml
          cat iso.yaml

      - name: Naam van het image (kleine letters)
        id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Live-omgeving met RandomOS bouwen
        run: |
          set -euxo pipefail
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="ghcr.io/ublue-os/bazzite:stable" \
            --build-arg INSTALL_IMAGE_PAYLOAD="ghcr.io/${{ steps.names.outputs.owner }}/randomos:latest" \
            --build-arg FLATPAK_DIR_SHORTNAME="kde_flatpaks" \
            -t localhost/payload:latest bazzite-src/installer/

      - name: ISO maken
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/payload:latest
          iso-dest: randomos-live-amd64.iso

      - name: Controlegetal (checksum)
        id: out
        run: |
          set -euxo pipefail
          mkdir -p upload
          mv "${{ steps.build.outputs.iso-dest }}" upload/
          (cd upload && sha256sum randomos-live-amd64.iso | tee randomos-live-amd64.iso-CHECKSUM)
          ls -lh upload

      - name: ISO uploaden (download via de Actions-pagina)
        uses: actions/upload-artifact@v4
        with:
          name: randomos-iso
          path: upload/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
