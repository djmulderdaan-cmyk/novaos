<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>RandomOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-pad="xbox">
  <!-- achtergrond -->
  <div id="bg" aria-hidden="true">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
    <div class="bg-shade"></div>
  </div>
  <canvas id="ambient" aria-hidden="true"></canvas>

  <!-- opstartanimatie -->
  <div id="intro" aria-hidden="true">
    <div class="intro-mark">
      <div class="intro-glow"></div>
      <img class="intro-mascot" src="img/mascot.png" alt="">
      <div class="intro-word" id="introWord"></div>
    </div>
  </div>

  <div id="app">
    <header id="topbar">
      <div class="brand" aria-label="RandomOS">
        <svg viewBox="0 0 120 120" class="brand-ring"><circle cx="60" cy="60" r="44"/><g transform="translate(94 26) rotate(18)"><rect x="-13" y="-18" width="26" height="36" rx="5" fill="#fff"/><path d="M0 -9 L7 0 L0 9 L-7 0 Z" fill="#e5413a"/></g></svg>
      </div>
      <nav id="tabs">
        <span class="glyph" data-btn="lb"></span>
        <button class="tab" data-focus data-group="tabs" data-tab="home">Home</button>
        <button class="tab" data-focus data-group="tabs" data-tab="library">Bibliotheek</button>
        <button class="tab" data-focus data-group="tabs" data-tab="settings">Instellingen</button>
        <span class="glyph" data-btn="rb"></span>
      </nav>
      <div class="status">
        <div class="profile" id="profile"><div class="avatar" id="avatar"></div><span id="profileName"></span></div>
        <span class="st-icon" id="stWifi" title="Wifi"></span>
        <span class="st-icon" id="stBt" title="Bluetooth"></span>
        <span class="st-batt" id="stBatt"></span>
        <span class="clock" id="clock">--:--</span>
      </div>
    </header>

    <main>
      <!-- HOME -->
      <section class="screen" id="screen-home">
        <div class="hero" id="hero">
          <div class="hero-greet" id="greeting"></div>
          <div class="hero-logo" id="heroLogo"></div>
          <div class="hero-meta" id="heroMeta"></div>
          <div class="hero-actions">
            <button class="btn primary" data-focus data-group="hero" id="playBtn"><span class="ico play"></span><span>Spelen</span></button>
            <button class="btn ghost" data-focus data-group="hero" id="favBtn"><span class="ico star"></span><span>Favoriet</span></button>
            <button class="btn ghost" data-focus data-group="hero" id="infoBtn"><span class="ico info"></span><span>Info</span></button>
          </div>
        </div>
        <div class="rail-wrap">
          <div class="rail-title" id="railTitle">Verder spelen</div>
          <div class="rail" id="homeRail"></div>
        </div>
      </section>

      <!-- BIBLIOTHEEK -->
      <section class="screen" id="screen-library">
        <div class="lib-head">
          <h2>Bibliotheek <span class="count" id="libCount"></span></h2>
          <div class="chips" id="chips"></div>
          <div class="lib-tools">
            <button class="btn small ghost" data-focus data-group="libtools" id="searchBtn"><span class="ico search"></span><span id="searchLabel">Zoeken</span></button>
            <button class="btn small ghost" data-focus data-group="libtools" id="sortBtn"><span class="ico sort"></span><span id="sortLabel">A–Z</span></button>
          </div>
        </div>
        <div class="grid" id="libGrid"></div>
      </section>

      <!-- INSTELLINGEN -->
      <section class="screen" id="screen-settings">
        <nav class="set-nav" id="setNav"></nav>
        <div class="set-panel" id="setPanel"></div>
      </section>
    </main>

    <footer id="hints"></footer>
  </div>

  <div id="modals"></div>
  <div id="toasts"></div>

  <script src="js/util.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/input.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/osk.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/extras.js"></script>
</body>
</html>
